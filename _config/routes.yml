---
Name: silverstripe-frontdesk-kit-routes
After:
  - '#rootroutes'
  - '#coreroutes'
---
SilverStripe\Control\Director:
  rules:
    'fdk-search': 'Atwx\SilverstripeFrontdeskKit\Search\SearchController'
    'profile//$Action/$ID': 'Atwx\SilverstripeFrontdeskKit\Controller\ProfileController'
