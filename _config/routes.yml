    'groups//$Action/$ID':  'Atwx\SilverstripeFrontdeskKit\Controller\GroupManageController'
    'site-config//$Action': 'Atwx\SilverstripeFrontdeskKit\Controller\SiteConfigController'
    'catalogs//$Action/$ID': 'Atwx\SilverstripeFrontdeskKit\Controller\CatalogController'
